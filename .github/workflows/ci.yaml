name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Cargo test
    runs-on: ubuntu-latest
    steps:
      - name: Check out hardhatdb-proxy
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test
